# TalkToMe language pack — English (schema talktome-lang/1)
# Author: Olivier Vitrac, PhD, HDR — Adservio Innovation Lab — Adservio Group — olivier.vitrac@adservio.fr

schema = "talktome-lang/1"
code = "en"
name = "English"
status = "stable"
default = true
engine = "kokoro"

[kokoro]
lang = "voice"            # en-us for a* voices, en-gb for b* voices

[voices]
f = "bf_emma"
m = "bm_george"
pool_f = ["bf_emma", "af_heart", "bf_isabella"]
pool_m = ["bm_george", "am_michael", "bm_lewis"]

[words]
fallback_session = "this session"
discreet_session = "a session"
his = { m = "his", f = "her" }

[grammar]
articles = {}
skip = ["the", "a", "an"]
plural = []
elision = []
contractions = []

[templates.useful]
help = ["{name}, {session} needs your help."]
attention = ["{name}, {session} needs your attention."]
input = ["{name}, {session} needs your input."]
landed = ["{name}, the results of {session} landed."]

[templates.fun]
help = [
  "Psst, {name}. {session} has a question only you can answer.",
  "{name}, {session} is standing at a fork in the road. Your call.",
  "{session} raises a hand, {name}. Help wanted.",
  "{name}, {session} would like a human opinion before going further.",
  "Quick one, {name}: {session} needs you to decide.",
]
attention = [
  "Knock knock, {name}. {session} needs your green light.",
  "{name}, {session} is waiting at the door for your approval.",
  "Excuse me, {name}: {session} needs your signature.",
  "{session} is holding {his} breath, {name}. Permission, please?",
  "{name}, one click from you and {session} is back on {his} way.",
]
input = [
  "Your move, {name}. {session} is waiting.",
  "{session} is all ears, {name}.",
  "{name}, {session} has said {his} piece. Over to you.",
  "Whenever you're ready, {name}, {session} is listening.",
  "{session} is twiddling {his} thumbs, {name}.",
]
landed = [
  "Ta-da! {session} has delivered, {name}.",
  "{name}, fresh results from {session}, still warm.",
  "Mission complete for {session}. Come and see, {name}.",
  "{session} has landed {his} work on your desk, {name}.",
  "Good news, {name}: {session} is done.",
]

[joke]
items = [
  "Why do programmers prefer dark mode? Because light attracts bugs.",
  "How many programmers does it take to change a light bulb? None. That's a hardware problem.",
  "Why don't scientists trust atoms? Because they make up everything.",
  "I told my wife she was drawing her eyebrows too high. She looked surprised.",
  "What do you call a fake noodle? An impasta.",
  "Why did the scarecrow win an award? Because he was outstanding in his field.",
  "An S Q L query walks into a bar, goes up to two tables and asks: may I join you?",
  "Why do Java developers wear glasses? Because they don't C sharp.",
  "I would tell you a joke about U D P, but you might not get it.",
  "Why was the math book sad? It had too many problems.",
  "Why did the developer go broke? Because he used up all his cache.",
  "I'm reading a book about anti-gravity. It's impossible to put down.",
]

[fact]
items = [
  "Did you know? Octopuses have three hearts and blue blood.",
  "Did you know? A day on Venus lasts longer than a year on Venus.",
  "Did you know? Bananas are slightly radioactive, because of the potassium they contain.",
  "Did you know? There are more trees on Earth than stars in the Milky Way.",
  "Did you know? Cleopatra lived closer in time to us than to the building of the Great Pyramid of Giza.",
  "Did you know? Wombats produce cube-shaped droppings.",
  "Did you know? The University of Oxford is older than the Aztec Empire.",
  "Did you know? A bolt of lightning is about five times hotter than the surface of the Sun.",
  "Did you know? Sea otters hold hands while they sleep, so they don't drift apart.",
  "Did you know? In nineteen forty-seven, a real moth stuck in a relay of the Harvard Mark Two was logged as the first actual case of a bug being found.",
  "Did you know? Stretched out, the DNA in a single human cell is about two metres long.",
  "Did you know? Flamingos are pink because of the pigments in what they eat.",
  "Did you know? Light from the Sun takes about eight minutes and twenty seconds to reach us.",
  "Did you know? The national animal of Scotland is the unicorn.",
  "Did you know? A shrimp's heart is in its head.",
]

[why]
special = [
  "Why not?",
  "Don't ask.",
  "Because the tests said so.",
  "It seemed like a good idea at the time.",
  "Ask the compiler.",
  "It's in the specification.",
  "Legacy reasons.",
  "It works on my machine.",
  "No comment.",
  "Because it is Friday.",
]
names = ["Ada", "Alan", "Grace", "Linus", "Margaret", "Dennis", "Barbara", "Edsger", "Frances", "Donald"]
adjectives = ["tall", "sleepy", "brilliant", "nervous", "retired", "caffeinated", "mysterious", "anxious", "generous", "stubborn"]
nouns = ["engineer", "mathematician", "intern", "project manager", "hamster", "compiler", "architect", "customer", "auditor", "robot"]
verbs = ["wanted", "asked for", "approved", "insisted on", "suggested", "demanded", "dreamed of", "refactored"]
goals = ["please", "impress", "confuse", "reassure", "fool", "satisfy", "outsmart", "delight"]
np = "the {adj} {noun}"
patterns = ["Because {subject} {verb} it.", "To {goal} {np}.", "{subject} told me to."]
