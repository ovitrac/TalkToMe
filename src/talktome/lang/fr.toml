# TalkToMe language pack — French (schema talktome-lang/1). Tutoiement; one Kokoro voice for every session.
# Author: Olivier Vitrac, PhD, HDR — Adservio Innovation Lab — Adservio Group — olivier.vitrac@adservio.fr

schema = "talktome-lang/1"
code = "fr"
name = "Français"
status = "stable"
default = true
engine = "kokoro"

[kokoro]
lang = "fr-fr"

[voices]
f = "ff_siwis"
m = "ff_siwis"
pool_f = ["ff_siwis"]
pool_m = []

[words]
fallback_session = "cette session"
discreet_session = "une session"
his = { m = "son", f = "son" }

[grammar]
articles = { la = "f", une = "f", le = "m", un = "m" }
skip = ["les", "l", "des", "du", "de"]
plural = ["les", "des"]
# applied before a vowel (le/la → l', de → d', que → qu')
elision = [["le", "l'"], ["la", "l'"], ["de", "d'"], ["que", "qu'"]]
contractions = []

[templates.useful]
help = ["{name}, {session} a besoin de ton aide."]
attention = ["{name}, {session} a besoin de ton attention."]
input = ["{name}, {session} attend ta réponse."]
landed = ["{name}, les résultats de {session} sont déposés."]

[templates.fun]
help = [
  "Psst, {name} ! {session} a une question pour toi.",
  "{name}, {session} hésite à la croisée des chemins. À toi de trancher.",
  "{session} lève la main, {name}. On a besoin de toi.",
  "{name}, {session} aimerait ton avis avant d'aller plus loin.",
  "Une petite décision, {name} : {session} compte sur toi.",
]
attention = [
  "Toc toc, {name} ! {session} attend ton feu vert.",
  "{name}, {session} patiente à la porte. Tu autorises ?",
  "Pardon de te déranger, {name} : {session} a besoin de ta signature.",
  "{session} retient son souffle, {name}. Une autorisation, s'il te plaît ?",
  "{name}, un clic de ta part et {session} repart.",
]
input = [
  "À toi de jouer, {name}. {session} t'attend.",
  "{session} est tout ouïe, {name}.",
  "{name}, {session} a fini. La parole est à toi.",
  "Quand tu veux, {name}, {session} t'écoute.",
  "{session} se tourne les pouces, {name}.",
]
landed = [
  "Et voilà ! {session} a livré, {name}.",
  "{name}, les résultats de {session} sont servis, encore chauds.",
  "Mission accomplie pour {session}. Viens voir, {name} !",
  "{session} a déposé son travail sur ton bureau, {name}.",
  "Bonne nouvelle, {name} : {session} a terminé.",
]

[joke]
items = [
  "C'est l'histoire d'un pingouin qui respirait par les fesses. Un jour, il s'est assis. Et il est mort.",
  "Pourquoi les plongeurs plongent-ils toujours en arrière, et jamais en avant ? Parce que sinon, ils tombent dans le bateau.",
  "Que fait une fraise sur un cheval ? Tagada, tagada !",
  "Qu'est-ce qui est jaune et qui attend ? Jonathan.",
  "Pourquoi les canards sont-ils toujours à l'heure ? Parce qu'ils sont dans l'étang.",
  "Quel est le comble pour un électricien ? De ne pas être au courant.",
  "C'est l'histoire d'un homme qui entre dans un café. Et plouf.",
  "Combien de développeurs faut-il pour changer une ampoule ? Aucun : c'est un problème matériel.",
  "Pourquoi les poissons détestent-ils l'ordinateur ? À cause du Net.",
  "Que dit une imprimante dans l'eau ? J'ai papier.",
  "Pourquoi les éléphants n'utilisent-ils pas d'ordinateur ? Parce qu'ils ont peur de la souris.",
  "Que dit un oignon quand il se cogne ? Aïe !",
]

[fact]
items = [
  "Tu savais ? Les pieuvres ont trois cœurs et le sang bleu.",
  "Tu savais ? Sur Vénus, une journée dure plus longtemps qu'une année.",
  "Tu savais ? Les bananes sont légèrement radioactives, à cause du potassium qu'elles contiennent.",
  "Tu savais ? Il y a plus d'arbres sur Terre que d'étoiles dans la Voie lactée.",
  "Tu savais ? Cléopâtre a vécu plus près de nous dans le temps que de la construction de la grande pyramide de Gizeh.",
  "Tu savais ? Les wombats produisent des crottes en forme de cube.",
  "Tu savais ? L'université d'Oxford est plus ancienne que l'Empire aztèque.",
  "Tu savais ? Un éclair est environ cinq fois plus chaud que la surface du Soleil.",
  "Tu savais ? Les loutres de mer se tiennent la patte en dormant, pour ne pas dériver chacune de son côté.",
  "Tu savais ? En mille neuf cent quarante-sept, un vrai papillon de nuit, coincé dans un relais du Harvard Mark Deux, a été consigné comme le premier vrai cas de bug.",
  "Tu savais ? Déroulé, l'ADN d'une seule cellule humaine mesure environ deux mètres.",
  "Tu savais ? Les flamants roses doivent leur couleur aux pigments de leur alimentation.",
  "Tu savais ? La lumière du Soleil met environ huit minutes et vingt secondes à nous parvenir.",
  "Tu savais ? L'animal national de l'Écosse est la licorne.",
  "Tu savais ? Le cœur de la crevette se trouve dans sa tête.",
]

[why]
special = [
  "Pourquoi pas ?",
  "Ne demande pas.",
  "Parce que les tests l'ont dit.",
  "Ça semblait une bonne idée sur le moment.",
  "Demande au compilateur.",
  "C'est dans le cahier des charges.",
  "Pour des raisons historiques.",
  "Ça marche sur ma machine.",
  "Sans commentaire.",
  "Parce que c'est vendredi.",
]
names = ["Ada", "Alan", "Grace", "Linus", "Margaret", "Dennis", "Barbara", "Edsger", "Frances", "Donald"]
# [masculine, feminine]
adjectives = [
  ["ensommeillé", "ensommeillée"], ["brillant", "brillante"], ["nerveux", "nerveuse"], ["retraité", "retraitée"],
  ["survolté", "survoltée"], ["mystérieux", "mystérieuse"], ["inquiet", "inquiète"], ["généreux", "généreuse"],
  ["têtu", "têtue"], ["surmené", "surmenée"],
]
# [noun, gender]
nouns = [
  ["ingénieur", "m"], ["mathématicienne", "f"], ["stagiaire", "m"], ["cheffe de projet", "f"], ["hamster", "m"],
  ["compilateur", "m"], ["architecte", "f"], ["cliente", "f"], ["auditeur", "m"], ["robot", "m"],
]
verbs = ["voulu", "demandé", "approuvé", "exigé", "suggéré", "rêvé", "réclamé", "imposé"]
goals = ["impressionner", "rassurer", "embrouiller", "contenter", "épater", "satisfaire", "amuser", "berner"]
articles = { m = "le", f = "la" }
np = "{art} {noun} {adj}"
patterns = ["Parce que {subject} l'a {verb}.", "Pour {goal} {np}.", "{subject} me l'a demandé."]
