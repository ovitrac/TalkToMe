# TalkToMe — jokes, surprising facts and `why` (design §7.1) — schema talktome-fun/1
# Author: Olivier Vitrac, PhD, HDR — Adservio Innovation Lab — Adservio Group — olivier.vitrac@adservio.fr
#
# Written to be heard: no joke relies on reading digits or symbols aloud. Facts are well established ones only.
# `why` answers in the spirit of MATLAB's `why`: a random, grammatical, useless answer (own word lists).

schema = "talktome-fun/1"

